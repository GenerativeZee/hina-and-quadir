<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMax slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#FBF1E2"/>
    <stop offset=".34" stop-color="#F6E4CB"/>
    <stop offset=".60" stop-color="#EFD3AC"/>
    <stop offset=".82" stop-color="#E7C79B"/>
    <stop offset="1"   stop-color="#E2BE8D"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".62" r=".42">
    <stop offset="0"   stop-color="#FFF6E2" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#FBE3B8" stop-opacity=".55"/>
    <stop offset="1"   stop-color="#F3D2A0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFBF3"/><stop offset="1" stop-color="#F0DFC4"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#F4DEBB" stop-opacity=".9"/>
    <stop offset="1"   stop-color="#EBCDA0" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="veil" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0"   stop-color="#FFFFFC" stop-opacity=".98"/>
    <stop offset=".55" stop-color="#FFFAF0" stop-opacity=".78"/>
    <stop offset="1"   stop-color="#FCF3E2" stop-opacity=".1"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7E9D2" stop-opacity="0"/>
    <stop offset="1" stop-color="#F5E4CA" stop-opacity=".85"/>
  </linearGradient>
  <filter id="blur6"  x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur3"  x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>

  <!-- the whole skyline, reused for its own reflection -->
  <g id="skyline" fill="url(#stone)">
    <!-- minarets -->
    <g>
      <rect x="168" y="470" width="26" height="430" rx="4"/>
      <path d="M168,470 C168,438 176,420 181,410 C186,420 194,438 194,470 Z"/>
      <path d="M181,410 V392"/><circle cx="181" cy="386" r="5"/>
      <rect x="160" y="556" width="42" height="9" rx="4"/>
      <rect x="162" y="640" width="38" height="8" rx="4"/>
    </g>
    <g>
      <rect x="706" y="470" width="26" height="430" rx="4"/>
      <path d="M706,470 C706,438 714,420 719,410 C724,420 732,438 732,470 Z"/>
      <path d="M719,410 V392"/><circle cx="719" cy="386" r="5"/>
      <rect x="698" y="556" width="42" height="9" rx="4"/>
      <rect x="700" y="640" width="38" height="8" rx="4"/>
    </g>
    <!-- side domes + wings -->
    <path d="M236,742 C236,690 258,660 286,640 C314,660 336,690 336,742 Z"/>
    <rect x="246" y="742" width="80" height="24" rx="6"/>
    <rect x="232" y="766" width="108" height="134" rx="5"/>
    <path d="M564,742 C564,690 586,660 614,640 C642,660 664,690 664,742 Z"/>
    <rect x="574" y="742" width="80" height="24" rx="6"/>
    <rect x="560" y="766" width="108" height="134" rx="5"/>
    <!-- central dome -->
    <path d="M356,706 C356,626 386,570 450,520 C514,570 544,626 544,706 Z"/>
    <path d="M450,520 V486"/><circle cx="450" cy="478" r="8"/>
    <rect x="372" y="706" width="156" height="30" rx="8"/>
    <rect x="330" y="736" width="240" height="164" rx="6"/>
  </g>
</defs>

<!-- sky -->
<rect width="900" height="1400" fill="#F3DFC0"/>
<rect width="900" height="1400" fill="url(#sky)"/>
<ellipse cx="450" cy="700" rx="470" ry="360" fill="url(#sun)"/>

<!-- skyline + reflection -->
<g opacity=".2" filter="url(#blur6)" transform="translate(0,1800) scale(1,-1)">
  <use href="#skyline"/>
</g>
<g opacity=".93"><use href="#skyline"/></g>
<g opacity=".28" fill="#D8B788">
  <path d="M330,868 h240 v32 h-240 z"/>
</g>

<!-- doorway on the central block -->
<path d="M414,900 V812 C414,772 430,752 450,752 C470,752 486,772 486,812 V900 Z"
      fill="#E4C79C" opacity=".55"/>

<!-- water -->
<rect x="0" y="900" width="900" height="500" fill="url(#water)"/>
<g stroke="#FFF8EA" stroke-width="2" opacity=".33">
  <path d="M60,960 H320"/><path d="M600,960 H840"/>
  <path d="M120,1010 H300"/><path d="M580,1006 H820"/>
  <path d="M40,1064 H240"/><path d="M660,1070 H860"/>
  <path d="M100,1130 H280"/><path d="M620,1136 H840"/>
</g>

<!-- walkway -->
<path d="M330,900 L250,1400 H650 L570,900 Z" fill="#F7EAD3" opacity=".8"/>
<path d="M330,900 L250,1400" stroke="#E3C79E" stroke-width="2" opacity=".5" fill="none"/>
<path d="M570,900 L650,1400" stroke="#E3C79E" stroke-width="2" opacity=".5" fill="none"/>

<!-- the couple, seen from behind, walking away -->
<g transform="translate(450,900) scale(0.82) translate(-450,-1016)">
  <!-- the bride's veil, trailing toward the viewer -->
  <path d="M480,880 C534,986 588,1170 622,1400 H330 C366,1170 424,986 480,880 Z"
        fill="url(#veil)" filter="url(#blur3)"/>
  <path d="M480,880 C534,986 588,1170 622,1400 M480,880 C426,986 372,1170 338,1400"
        stroke="#E8D2AE" stroke-width="1.4" fill="none" opacity=".28"/>
  <path d="M482,900 C516,1000 548,1160 566,1340" stroke="#FFFDF6" stroke-width="2"
        fill="none" opacity=".45"/>
  <path d="M478,900 C444,1000 412,1160 394,1340" stroke="#FFFDF6" stroke-width="2"
        fill="none" opacity=".45"/>

  <!-- groom in an ivory sherwani -->
  <g>
    <path d="M400,892 C398,880 405,871 415,871 C425,871 432,880 430,892
             L438,1014 H392 Z" fill="#DFCAA6"/>
    <path d="M415,871 c-13,0 -20,9 -21,22 l-3,20 h48 l-3,-20 c-1,-13 -8,-22 -21,-22 z"
          fill="#EBD9BA"/>
    <path d="M415,893 V1010" stroke="#CDB490" stroke-width="1.4" opacity=".6" fill="none"/>
    <circle cx="415" cy="856" r="13" fill="#A5835C"/>
    <path d="M402,850 c0,-10 6,-16 13,-16 c7,0 13,6 13,16 c-8,-3 -18,-3 -26,0 z" fill="#E4D2B0"/>
  </g>

  <!-- bride in a cream lehenga, dupatta over her hair -->
  <g>
    <path d="M462,900 C460,886 468,876 479,876 C490,876 498,886 496,900
             L512,1016 H446 Z" fill="#FFFBF1"/>
    <path d="M479,876 c-14,0 -21,10 -22,24 l-2,18 h48 l-2,-18 c-1,-14 -8,-24 -22,-24 z"
          fill="#FFFDF8"/>
    <circle cx="479" cy="862" r="12" fill="#A5835C"/>
    <path d="M465,872 C464,850 470,840 479,840 C488,840 494,850 493,872
             C486,866 472,866 465,872 Z" fill="#FFFDF8"/>
    <path d="M467,876 C470,900 474,916 479,928 C484,916 488,900 491,876"
          stroke="#EFDCBB" stroke-width="1.4" fill="none" opacity=".8"/>
  </g>

  <!-- hands joined, and one soft shadow beneath them both -->
  <ellipse cx="450" cy="1020" rx="86" ry="13" fill="#DCBE94" opacity=".34" filter="url(#blur6)"/>
</g>

<!-- atmosphere -->
<rect x="0" y="1040" width="900" height="360" fill="url(#haze)"/>
<g fill="#FFF8E6" opacity=".55">
  <circle cx="180" cy="620" r="3"/><circle cx="260" cy="520" r="2"/>
  <circle cx="690" cy="580" r="2.5"/><circle cx="760" cy="700" r="2"/>
  <circle cx="120" cy="800" r="2.5"/><circle cx="820" cy="470" r="2"/>
  <circle cx="560" cy="470" r="2"/><circle cx="350" cy="440" r="2.5"/>
</g>
<rect width="900" height="1400" fill="#F6E3C6" opacity=".14"/>
</svg>
